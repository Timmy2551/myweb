<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body style="background-color: #93b8de;">
    <div class="card">
        <img src="https://i.pinimg.com/1200x/5b/af/96/5baf960a41377d9d7c5aa804df4cb2aa.jpg" alt="" style="height: 500px;">
    </div>
    <div class="container " style="margin-top: 20px;">
        <form>
            <!--Text Field-->
            <div>
                <label for="name">ชื่อ</label>
                <input type="text" class="form-control " placeholder="กรณาป้อนชื่อ">
            </div>
            <div>
                <label for="email">อีเมล</label>
                <input type="email" class="form-control" placeholder="กรุณาป้อนอีเมล">
            </div>
            <div>
                <label for="password">รหัสผ่าน</label>
                <input type="password" class="form-control" placeholder="กรุณาป้อนรหัสผ่าน">
            </div>
            <br>
            <!--select-->
            <div>
                <label for="job" class="form-control">อาชีพ</label>
                <select name="job"  class="form-select">
                    <option>programmer</option>
                    <option>Developer</option>
                    <option>อาจารย์</option>
                    <option>ทนายความ</option>
                </select>
            </div>
            <br>
            <!--TextArea-->
            <div class="mb-3">
                <label class="form-label"  class="form-label">ที่อยู่</label>
                <textarea class="form-control" cols="30" rows="5"></textarea>
            </div>
            <!-- File-->
             <div class="mb-3">
                <label class="form-label">เอกสาร</label>
                <input type="text" class="form-control">
             </div>
             <br>
             <!-- Range -->
             <div class="mb-3">
                <label class="form-label">ประสบการณ์ทำงาน</label>
                <input type="range" min="1" max="5" value="5" class="form-range">
             </div>
             <input type="submit" name="" id="" value="บันทึกข้อมูล" class="btn btn-success"> 
        </form>
        <br>
        <form class="mb-3">
            <div>
                <label class="form-label">ชื่อ</label>
                <input type="text" placeholder="กรุณาป้อนชื่อ" class="form-control">
            </div>
            <dir>
                <label class="form-label">รหัสผ่าน</label>
                <input type="password" placeholder="กรุณาป้อนรหัสผ่าน" class="form-control">
            </dir>
            <div class="form-chech">
                <label>
                    <input type="checkbox" name="" class="form-chech-input">ฉันยอมรับเงื่อนไข
                </label>
            </div>
            <button class="btn btn-danger">ส่งข้อมูล</button>
         <!--form check-->   
        </form class="md-3">
        <br>
        <!--validation-->
        <div class="mb-3">
            <label for="name" class="form-label">ชื่อ</label>
            <input type="text" placeholder="กรุณาป้อนชื่อ" class="form-control is-valid">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">อีเมล</label>
            <input type="email" placeholder="กรุณาป้อนอีเมล" class="form-control is-invalid"> 
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">รหัสผ่าน</label>
            <input type="password" placeholder="กรุณาป้อนรหัสผ่าน" class="form-control is-valid">
            <div class="invalid-feedback">ป้อนรหัสผ่านไม่ถูกต้อง</div> 0
        </div>
    </div>
</body>
